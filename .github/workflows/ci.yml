name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: organization_brain
          POSTGRES_USER: organization_brain
          POSTGRES_PASSWORD: organization_brain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U organization_brain -d organization_brain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Local demonstration credentials only. Nothing here is a real secret.
      DATABASE_URL: postgresql://organization_brain:organization_brain@localhost:5432/organization_brain
      AI_PROVIDER: mock
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Load schema and fictional sample data
        run: psql "$DATABASE_URL" -f ../../database/init.sql
      - run: python -m compileall app
      - run: PYTHONPATH=. pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
